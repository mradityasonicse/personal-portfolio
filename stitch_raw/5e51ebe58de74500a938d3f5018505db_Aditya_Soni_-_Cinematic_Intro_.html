<!-- Background Shader -->
<!-- STITCH_SHADER_START:ANIMATION_31 class="absolute inset-0 w-full h-full z-0 pointer-events-none" -->
<div class="absolute inset-0 w-full h-full z-0 pointer-events-none" style="display:block;">
<canvas id="shader-canvas-ANIMATION_31" style="display:block;width:100%;height:100%"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_31');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;

uniform float u_time;
uniform vec2 u_resolution;
uniform vec2 u_mouse;
varying vec2 v_texCoord;

// Simplex noise for organic background movement
vec3 permute(vec3 x) { return mod(((x*34.0)+1.0)*x, 289.0); }
float snoise(vec2 v){
  const vec4 C = vec4(0.211324865405187, 0.366025403784439,
           -0.577350269189626, 0.024390243902439);
  vec2 i  = floor(v + dot(v, C.yy) );
  vec2 x0 = v -   i + dot(i, C.xx);
  vec2 i1;
  i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec4 x12 = x0.xyxy + C.xxzz;
  x12.xy -= i1;
  i = mod(i, 289.0);
  vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 ))
  + i.x + vec3(0.0, i1.x, 1.0 ));
  vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy),
    dot(x12.zw,x12.zw)), 0.0);
  m = m*m ;
  m = m*m ;
  vec3 x = 2.0 * fract(p * C.www) - 1.0;
  vec3 h = abs(x) - 0.5;
  vec3 ox = floor(x + 0.5);
  vec3 a0 = x - ox;
  m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
  vec3 g;
  g.x  = a0.x  * x0.x  + h.x  * x0.y;
  g.yz = a0.yz * x12.xz + h.yz * x12.yw;
  return 130.0 * dot(m, g);
}

void main() {
    vec2 uv = v_texCoord;
    vec2 mouse = u_mouse / u_resolution;
    
    // Kinetic Architect Palette
    vec3 colorBg = vec3(0.02, 0.04, 0.09); // surface-container-lowest
    vec3 colorAccent = vec3(0.9, 0.1, 0.1); // primary/red
    
    // Create a sense of "intro" energy with moving lines and noise
    float n = snoise(uv * 3.0 + u_time * 0.1);
    float glow = exp(-10.0 * length(uv - 0.5 + vec2(cos(u_time), sin(u_time)) * 0.2));
    
    // Scanlines
    float scanline = sin(uv.y * 400.0 + u_time * 5.0) * 0.015;
    
    // Subtle grid/network feel
    float grid = (step(0.99, fract(uv.x * 20.0)) + step(0.99, fract(uv.y * 20.0))) * 0.05;
    
    vec3 finalColor = mix(colorBg, colorAccent * 0.1, n * 0.5 + 0.5);
    finalColor += colorAccent * glow * 0.1;
    finalColor += scanline;
    finalColor += grid;
    
    // Radial mask to focus center
    float mask = 1.0 - smoothstep(0.2, 0.8, length(uv - 0.5));
    finalColor *= mix(0.5, 1.0, mask);

    gl_FragColor = vec4(finalColor, 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const nameContainer = document.getElementById('animated-name');
            const name = "ADITYA SONI";
            const delayBetweenLetters = 0.08; // seconds

            name.split('').forEach((char, index) => {
                if (char === ' ') {
                    const space = document.createElement('span');
                    space.innerHTML = '&nbsp;';
                    nameContainer.appendChild(space);
                } else {
                    const span = document.createElement('span');
                    span.textContent = char;
                    span.className = 'letter-reveal inline-block drop-shadow-lg';
                    span.style.animationDelay = `${index * delayBetweenLetters}s`;
                    nameContainer.appendChild(span);
                }
            });

            // Simulate redirect after progress completes
            setTimeout(() => {
                // window.location.href = '/home'; // Uncomment in production
                console.log('Intro finished. Redirecting...');
            }, 4000);
            
            // Skip button interaction
            const skipBtn = document.querySelector('.skip-btn');
            skipBtn.addEventListener('click', () => {
                 // window.location.href = '/home'; // Uncomment in production
                 console.log('Skip clicked. Redirecting...');
                 document.querySelector('.progress-line').style.width = '100%';
                 document.querySelector('.progress-line').style.transition = 'width 0.2s linear';
            });
        });
    </script>
