<style data-purpose="custom-fonts-and-theme">

    :root {
      --bg-main: #ffffff;
      --text-main: #1a1a1a;
      --text-muted: #666666;
      --accent-blue: #1d4ed8;
      --accent-blue-hover: #1e3a8a;
      --border-color: #e5e7eb;
    }

    body {
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    h1, h2, h3, .serif-font {
      font-family: 'Playfair Display', serif;
    }

    .mono-font {
      font-family: 'Space Mono', monospace;
    }

    /* Custom subtle gradient background */
    .bg-gradient-custom {
      background: radial-gradient(circle at 100% 50%, rgba(29, 78, 216, 0.05) 0%, rgba(255, 255, 255, 1) 100%);
    }
  </style>
<style data-purpose="image-frame-styles">
    /* Styles for the circular profile image frame */
    .orbit-container {
      position: relative;
      width: 100%;
      max-width: 280px;
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @media (min-width: 768px) {
      .orbit-container {
        max-width: 320px;
      }
    }

    @media (min-width: 1024px) {
      .orbit-container {
        max-width: 400px;
      }
    }

    .orbit-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .orbit-ring-1 {
      width: 100%;
      height: 100%;
      border-color: rgba(255, 255, 255, 0.3); /* White outer ring */
    }

    .orbit-ring-2 {
      width: 85%;
      height: 85%;
      border: 1px solid rgba(239, 68, 68, 0.5); /* Red inner ring */
    }

    .profile-image-wrapper {
      width: 70%;
      height: 70%;
      border-radius: 50%;
      overflow: hidden;
      position: relative;
      z-index: 10;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    .profile-image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Small decorative crosshairs */
    .crosshair {
      position: absolute;
      width: 10px;
      height: 10px;
      color: rgba(239, 68, 68, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
    }
    .crosshair-top { top: -5px; left: 50%; transform: translateX(-50%); }
    .crosshair-right { right: -5px; top: 50%; transform: translateY(-50%); color: rgba(255, 255, 255, 0.8); }
    .crosshair-bottom { bottom: -5px; left: 50%; transform: translateX(-50%); }
    .crosshair-left { left: -5px; top: 50%; transform: translateY(-50%); color: rgba(255, 255, 255, 0.8); }
  </style>
